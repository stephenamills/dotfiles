# ----- Core -----
model              = "gpt-5.6-luna"
approval_policy    = "on-request"
approvals_reviewer = "auto_review"
file_opener        = "vscode"

model_reasoning_effort     = "medium"
model_reasoning_summary    = "auto"
plan_mode_reasoning_effort = "xhigh"

check_for_update_on_startup = false

default_permissions = "nested-codex"

# No top-level `notify`: all notifications now run through the hooks below. The
# legacy notify payload cannot distinguish a real turn from a subagent's, and it
# reports an empty last-assistant-message for Plan mode, so plan turns never
# notified through it.
service_tier = "default"

[features]
multi_agent = true
prevent_idle_sleep = true

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
tool_namespace = "agents"
max_concurrent_threads_per_session = 7

# ----- Permissions -----
[permissions.nested-codex]
description = "Workspace access plus personal Codex configuration, agent skills, and dotfiles synchronization"
extends = ":workspace"

[permissions.nested-codex.filesystem]
# Personal Codex and agent directories
"~/.codex"           = "write"
"~/.codex/AGENTS.md" = "write"
"~/.codex/skills"    = "write"
"~/.agents"          = "write"
"~/.agents/skills"   = "write"

# Dotfiles repository and its protected .agents directory
"/Users/steph/projects/zsh/dotfiles"         = "write"
"/Users/steph/projects/zsh/dotfiles/.agents" = "write"

# Other Codex files should be read-only
"~/.codex/auth.json"         = "read"
"~/.codex/config.toml"       = "read"
"~/.codex/plugins"           = "read"
"~/.codex/rules"             = "read"
"~/.codex/requirements.toml" = "read"

# I sometimes create Claude skills from Codex
"/Users/steph/.claude/skills" = "write"

[permissions.nested-codex.network]
enabled = true

[permissions.nested-codex.network.domains]
"chatgpt.com"     = "allow"
"*.chatgpt.com"   = "allow"
"api.openai.com"  = "allow"
"auth.openai.com" = "allow"

[permissions.nested-codex.network.unix_sockets]
"/Users/steph/.codex/app-server-control/app-server-control.sock" = "allow"

# ----- History & TUI -----
[history]
persistence = "save-all"
max_bytes   = 10_485_760

[tui]
animations             = true
#notifications          = true
#notification_condition = "always"
#notification_method    = "osc9"
theme                 = "catppuccin-mocha"
status_line            = ["model-with-reasoning", "current-dir", "run-state", "approval-mode", "context-remaining", "context-window-size", "five-hour-limit", "used-tokens", "total-input-tokens", "total-output-tokens", "task-progress", "weekly-limit"]
status_line_use_colors = true
session_picker_view    = "dense"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

# ----- Projects -----
[projects."/Users/steph/Downloads"]
trust_level = "trusted"

[projects."/Users/steph/projects"]
trust_level = "trusted"

[projects."/Users/steph/.agents"]
trust_level = "trusted"

[projects."/private/var/folders"]
trust_level = "trusted"

[projects."/Volumes/videos/Finance/Ω - Excel/Ω Power BI/Maven Analytics/1 Microsoft Power BI Desktop/.study-guide-powerbi/runs/20260812-204542-2939d6c8/1-microsoft-power-bi-desktop-0-course-intro"]
trust_level = "trusted"

[projects."/Volumes/videos/Finance/Ω - Excel/Ω Power BI/Maven Analytics/.study-guide-powerbi/runs/20260812-205802-070b5bf2/1-microsoft-power-bi-desktop-lesson-03-03-database-normalization"]
trust_level = "trusted"

[projects."/Volumes/videos/Finance/Ω - Excel/Ω Power BI/Maven Analytics/1 Microsoft Power BI Desktop/.study-guide-powerbi/runs/20260812-210929-2b225918/1-microsoft-power-bi-desktop-lesson-03-03-database-normalization-v2"]
trust_level = "trusted"

[projects."/Users/steph/projects/zsh/dotfiles"]
trust_level = "trusted"

# ----- Plugins -----

[plugins]
"documents@openai-primary-runtime"        = { enabled = true }
"spreadsheets@openai-primary-runtime"     = { enabled = true }
"presentations@openai-primary-runtime"    = { enabled = true }
"pdf@openai-primary-runtime"              = { enabled = true }
"template-creator@openai-primary-runtime" = { enabled = true }
"sites@openai-bundled"                    = { enabled = true }
"visualize@openai-bundled"                = { enabled = true }
"browser@openai-bundled"                  = { enabled = true }

# ----- MCPs -----
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[notice]
hide_rate_limit_model_nudge = true

# Notification 1 of 3: a question needs an answer. Fires the moment Plan mode
# (or any turn) pauses on request_user_input.
[[hooks.PreToolUse]]
matcher = "^request_user_input$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "python3 /Users/steph/.codex/notify-ntfy.py"
timeout = 15
statusMessage = "Sending input-required notification"

# Both Stop handlers run when a root turn finishes. Subagent turns dispatch
# SubagentStop instead, so neither fires for them.
#
# Copy the finished plan to the clipboard the moment Plan mode emits it, before
# it is accepted or rejected. Codex has no ExitPlanMode tool and strips the
# <proposed_plan> block out of the assistant message, so the plan is read from
# the Plan item in the session rollout. Mirrors the Claude Code hook of the same
# name.
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/steph/.codex/copy-plan-to-clipboard.py"
timeout = 10
statusMessage = "Copying plan to clipboard"

# Notifications 2 and 3: the same turn end reports either "plan ready for
# review" or "work complete", from the same rollout read.
[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/steph/.codex/notify-ntfy.py"
timeout = 15
statusMessage = "Sending completion notification"

# trusted_hash is sha256 over the canonical JSON of each hook's normalized
# identity (event label + matcher + that single handler). Adding a handler does
# not change its siblings' hashes.
[hooks.state]

[hooks.state."/Users/steph/.codex/config.toml:pre_tool_use:0:0"]
trusted_hash = "sha256:72ba8cd2c2d860cac0c0e3a37b42c7ac58f575945d1872c1f7dfc7c9814d9366"
enabled = true

[hooks.state."/Users/steph/.codex/config.toml:stop:0:0"]
trusted_hash = "sha256:fb9ddf6113e45148788fc1129e5bf54ff34332f335365bd22a79176eeece8df0"
enabled = true

[hooks.state."/Users/steph/.codex/config.toml:stop:0:1"]
trusted_hash = "sha256:a4b7fb34cbaf9ea8ce41235c1734ca297310997e345b6ad16c99d5ba077ba1c4"
