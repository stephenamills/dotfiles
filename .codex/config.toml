# ----- Core -----
model              = "gpt-5.6-sol"
approval_policy    = "on-request"
approvals_reviewer = "auto_review"
file_opener        = "vscode"

model_reasoning_effort     = "xhigh"
model_reasoning_summary    = "auto"
plan_mode_reasoning_effort = "xhigh"

check_for_update_on_startup = false

default_permissions = "nested-codex"

notify = ["/Users/steph/.codex/notify-ntfy.sh"]
service_tier = "default"

[features]
multi_agent = true
prevent_idle_sleep = true

[features.multi_agent_v2]
enabled = true
hide_spawn_agent_metadata = false
tool_namespace = "agents"
max_concurrent_threads_per_session = 7

# ----- Permissions -----
[permissions.nested-codex]
description = "Workspace access plus personal Codex configuration, agent skills, and dotfiles synchronization"
extends = ":workspace"

[permissions.nested-codex.filesystem]
# Personal Codex and agent directories
"~/.codex"           = "write"
"~/.codex/AGENTS.md" = "write"
"~/.codex/skills"    = "write"
"~/.agents"          = "write"
"~/.agents/skills"   = "write"

# Dotfiles repository and its protected .agents directory
"/Users/steph/projects/zsh/dotfiles"         = "write"
"/Users/steph/projects/zsh/dotfiles/.agents" = "write"

# Other Codex files should be read-only
"~/.codex/auth.json"         = "read"
"~/.codex/config.toml"       = "read"
"~/.codex/plugins"           = "read"
"~/.codex/rules"             = "read"
"~/.codex/requirements.toml" = "read"

# I sometimes create Claude skills from Codex
"/Users/steph/.claude/skills" = "write"

[permissions.nested-codex.network]
enabled = true

[permissions.nested-codex.network.domains]
"chatgpt.com"     = "allow"
"*.chatgpt.com"   = "allow"
"api.openai.com"  = "allow"
"auth.openai.com" = "allow"

[permissions.nested-codex.network.unix_sockets]
"/Users/steph/.codex/app-server-control/app-server-control.sock" = "allow"

# ----- History & TUI -----
[history]
persistence = "save-all"
max_bytes   = 10_485_760

[tui]
animations             = true
#notifications          = true
#notification_condition = "always"
#notification_method    = "osc9"
theme                 = "catppuccin-mocha"
status_line            = ["model-with-reasoning", "current-dir", "run-state", "approval-mode", "context-remaining", "context-window-size", "five-hour-limit", "used-tokens", "total-input-tokens", "total-output-tokens", "task-progress", "weekly-limit"]
status_line_use_colors = true
session_picker_view    = "dense"

[tui.model_availability_nux]
"gpt-5.6-sol" = 4

# ----- Projects -----
[projects."/Users/steph/Downloads"]
trust_level = "trusted"

[projects."/Users/steph/projects"]
trust_level = "trusted"

[projects."/Users/steph/.agents"]
trust_level = "trusted"

[projects."/private/var/folders"]
trust_level = "trusted"

# ----- Plugins -----

[plugins]
"documents@openai-primary-runtime"        = { enabled = true }
"spreadsheets@openai-primary-runtime"     = { enabled = true }
"presentations@openai-primary-runtime"    = { enabled = true }
"pdf@openai-primary-runtime"              = { enabled = true }
"template-creator@openai-primary-runtime" = { enabled = true }
"sites@openai-bundled"                    = { enabled = true }
"visualize@openai-bundled"                = { enabled = true }
"browser@openai-bundled"                  = { enabled = true }

# ----- MCPs -----
[mcp_servers.openaiDeveloperDocs]
url = "https://developers.openai.com/mcp"

[notice]
hide_rate_limit_model_nudge = true

# Notify remotely as soon as Plan mode pauses for an answer. Normal completion
# notifications continue to use the top-level `notify` command above.
[[hooks.PreToolUse]]
matcher = "^request_user_input$"

[[hooks.PreToolUse.hooks]]
type = "command"
command = "/Users/steph/.codex/notify-ntfy.sh --hook"
timeout = 15
statusMessage = "Sending input-required notification"

# Copy the finished plan to the clipboard the moment Plan mode emits it, before
# it is accepted or rejected. Codex has no ExitPlanMode tool, so the plan is read
# out of the turn's final assistant message. Mirrors the Claude Code hook of the
# same name.
[[hooks.Stop]]

[[hooks.Stop.hooks]]
type = "command"
command = "python3 /Users/steph/.codex/copy-plan-to-clipboard.py"
timeout = 10
statusMessage = "Copying plan to clipboard"

[hooks.state]

[hooks.state."/Users/steph/.codex/config.toml:pre_tool_use:0:0"]
trusted_hash = "sha256:430526ebe2cb511665a0c74d71f924905787b70085f0a7153df7959e6f3a3696"

[hooks.state."/Users/steph/.codex/config.toml:stop:0:0"]
trusted_hash = "sha256:fb9ddf6113e45148788fc1129e5bf54ff34332f335365bd22a79176eeece8df0"
enabled = true
