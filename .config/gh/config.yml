# The current version of the config schema
version: 1
# What protocol to use when performing git operations. Supported values: ssh, https
git_protocol: https
# What editor gh should run when creating issues, pull requests, etc. If blank, will refer to environment.
editor: code --wait
# When to interactively prompt. This is a global config that cannot be overridden by hostname. Supported values: enabled, disabled
prompt: enabled
# A pager program to send command output to, e.g. "less". If blank, will refer to environment. Set the value to "cat" to disable the pager.
pager:
# Aliases allow you to create nicknames for gh commands
aliases:
    co: pr checkout
    # Search repositories, show compact star counts, and align the description
    # marker. The final gawk stage clips by display width, so CJK and emoji do
    # not wrap past the right edge.
    repos: |
        !w=$(stty size 2>/dev/null </dev/tty | cut -d" " -f2)

        # Read the terminal width for the final clipping stage.
        if [ -z "$w" ]; then w=${COLUMNS:-$(tput cols 2>/dev/null || echo 1000)}; fi
        # Fetch repository URLs, normalized descriptions, and star counts.
        gh search repos --archived=false --json url,description,stargazersCount \
            --jq '.[] | [(.url | ascii_downcase), (.description // "" | gsub("\\s+"; " ") | ltrimstr(" ") | rtrimstr(" ")), (.stargazersCount // 0)] | @tsv' "$@" \
            | awk -F '\t' '{
                # Format stars compactly and track each field width.
                url[NR] = $1
                description[NR] = $2
                stars[NR] = compact_stars($3)
                if (length(url[NR]) > max_url) max_url = length(url[NR])
                if (length(stars[NR]) > max_stars) max_stars = length(stars[NR])
              }
              function compact_stars(n, value) {
                if (n >= 1000000) {
                    value = sprintf("%.1f", n / 1000000)
                    sub(/\.0$/, "", value)
                    return value "m stars"
                }
                if (n >= 1000) {
                    value = sprintf("%.1f", n / 1000)
                    sub(/\.0$/, "", value)
                    return value "k stars"
                }
                return sprintf("%d stars", n)
              }
              END {
                # Right-align stars immediately before the aligned marker.
                for (i = 1; i <= NR; i++)
                    printf "%-*s %*s # %s\n", max_url, url[i], max_stars, stars[i], description[i]
              }' \
            | gawk -v max="${w:-1000}" '
                @load "ordchr"
                function wide(cp) {
                    # CJK and emoji generally occupy two terminal columns.
                    return ((cp >= 0x1100 && cp <= 0x115f) || cp == 0x2329 || cp == 0x232a ||
                            (cp >= 0x2e80 && cp <= 0xa4c6) || (cp >= 0xac00 && cp <= 0xd7a3) ||
                            (cp >= 0xf900 && cp <= 0xfaff) || (cp >= 0xfe10 && cp <= 0xfe19) ||
                            (cp >= 0xfe30 && cp <= 0xfe6f) || (cp >= 0xff01 && cp <= 0xff60) ||
                            (cp >= 0xffe0 && cp <= 0xffe6) || (cp >= 0x1f300 && cp <= 0x1faff) ||
                            cp >= 0x20000) ? 2 : 1
                }
                function clip(s, i, c, width) {
                    # Stop before a character would exceed the display width.
                    for (i = 1; i <= length(s); i++) {
                        c = substr(s, i, 1)
                        width += wide(ord(c))
                        if (width > max) return substr(s, 1, i - 1)
                    }
                    return s
                }
                { print clip($0) }
              '
# The path to a unix socket through which send HTTP connections. If blank, HTTP traffic will be handled by net/http.DefaultTransport.
http_unix_socket:
# What web browser gh should use when opening URLs. If blank, will refer to environment.
browser:
